<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer IBM Plex only for Arabic-language requests; leave English defaults alone. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>IBM Plex Sans Arabic</string>
    </edit>
  </match>

  <!--
    Apps like Chromium/Electron fall back per character with the UI locale
    (lang=en), so the rule above never fires for them. Noto Sans (the Latin
    default) has no Arabic glyphs, so placing IBM Plex right after it keeps
    English on Noto Sans while Arabic characters fall through to IBM Plex
    instead of DejaVu Sans.
  -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>IBM Plex Sans Arabic</family>
    </prefer>
  </alias>
</fontconfig>
